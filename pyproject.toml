[project]
name = "selection-tts"
version = "0.1.0"
description = "Windows system-wide selection TTS prototype (Phase 0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7.3.1",
    "pygame>=2.6.1",
    "pynput>=1.8.2",
    "pyperclip>=1.11.0",
    "pyside6>=6.12.0",
    "pywin32>=312",
    "uiautomation>=2.0.29",
]

[project.scripts]
selection-tts = "selection_tts:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
