name: 功能建议
description: 想要的新功能，或者觉得哪里的交互别扭
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 你的使用场景
      description: 什么情况下觉得别扭、缺什么能力
      placeholder: 例如：我经常读英文论文，希望点某一段能只读这一段然后自动停下
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: 你希望它怎么工作
      description: 描述理想的操作方式即可，不用考虑怎么实现
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 现在你用什么办法凑合（可选）
    validations:
      required: false
